<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Happy Birthday, Mumma</title>
  <style>
    :root {
      --vh: 100dvh;
      --bg: #f6efe6;
      --paper: #fffdf9;
      --paper-shadow: #eadbc8;
      --ink: #2c211b;
      --muted: #6e5a4f;
      --accent: #b84a39;
      --accent-soft: #f5e3df;
      --border: #cfb596;
      --w: min(440px, 92vw);
      --h: min(620px, calc(var(--vh) - 96px));
      --fs: clamp(15.5px, calc(var(--w) * 0.038), 18px);
      --radius: 14px;
    }

    @supports not (height: 100dvh) {
      :root {
        --vh: 100vh;
      }
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: var(--vh);
      background:
        radial-gradient(circle at 20% 15%, #fff8ee 0%, transparent 45%),
        radial-gradient(circle at 85% 85%, #ebd9c3 0%, transparent 50%),
        var(--bg);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      font-size: var(--fs);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .stage {
      min-height: var(--vh);
      padding:
        max(16px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(20px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      perspective: 1800px;
      overflow-x: clip;
    }

    .card {
      position: relative;
      width: var(--w);
      height: var(--h);
      transform-style: preserve-3d;
      transition: transform 1.1s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Two-page spread on desktop when opened */
    .card.open {
      transform: translateX(calc(var(--w) * 0.5));
    }

    .face {
      position: absolute;
      inset: 0;
      border-radius: var(--radius);
      background: var(--paper);
      border: 1px solid var(--border);
      box-shadow: 0 18px 40px rgba(44, 33, 27, 0.14);
      backface-visibility: hidden;
      overflow: hidden;
    }

    .cover {
      position: absolute;
      inset: 0;
      transform-origin: left center;
      transform-style: preserve-3d;
      transition: transform 1.15s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 2;
    }

    .card.open .cover {
      transform: rotateY(-165deg);
    }

    .face.front {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px 26px;
      cursor: pointer;
      background:
        linear-gradient(155deg, rgba(255, 255, 255, 0.75), rgba(244, 228, 207, 0.55)),
        var(--paper);
    }

    .face.front:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    .fine {
      width: 64px;
      height: 2px;
      background: var(--accent);
      opacity: 0.55;
      margin-bottom: 18px;
      border-radius: 2px;
    }

    .face.front h1 {
      margin: 0;
      font-size: clamp(1.75rem, 6vw, 2.35rem);
      font-weight: normal;
      line-height: 1.2;
      color: var(--ink);
    }

    .face.front h1 span {
      display: block;
      margin-top: 6px;
      color: var(--accent);
      font-style: italic;
    }

    .rule {
      width: 90px;
      height: 1px;
      background: var(--border);
      margin: 22px 0 16px;
    }

    .hint {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .face.back,
    .face.right {
      transform: rotateY(180deg);
    }

    .face.right {
      transform: none;
      z-index: 1;
    }

    .scroll {
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .inner {
      padding: 24px 22px 28px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .msg p {
      margin: 0 0 12px;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.55s ease, transform 0.55s ease;
    }

    .card.open .msg p.revealed {
      opacity: 1;
      transform: none;
    }

    .mobile-message {
      display: none;
    }

    .tabs {
      display: none;
      gap: 8px;
    }

    .tabs button {
      flex: 1;
      min-height: 44px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      border-radius: 999px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    .tabs button[aria-pressed="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .gallery-title {
      margin: 0 0 10px;
      font-size: 1.05rem;
      font-weight: normal;
      color: var(--muted);
    }

    .slider {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      min-height: 190px;
      border-radius: 10px;
      overflow: hidden;
      background: #efe4d6;
      border: 1px solid var(--border);
    }

    .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.45s ease;
      pointer-events: none;
    }

    .slide.active {
      opacity: 1;
      pointer-events: auto;
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .cap {
      margin: 10px 0 8px;
      font-size: 0.92rem;
      color: var(--muted);
      min-height: 1.4em;
      text-align: center;
    }

    .slider-ctl {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .slider-ctl button {
      min-width: 44px;
      min-height: 44px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--paper);
      color: var(--ink);
      font-size: 1.25rem;
      line-height: 1;
      cursor: pointer;
    }

    .dots {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
    }

    .dot {
      width: 10px;
      height: 10px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: var(--border);
      cursor: pointer;
    }

    .dot[aria-selected="true"] {
      background: var(--accent);
      transform: scale(1.2);
    }

    .closing {
      margin: 6px 0 0;
      padding-top: 12px;
      border-top: 1px dashed var(--border);
      font-style: italic;
      color: var(--accent);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .card.open .closing.revealed {
      opacity: 1;
      transform: none;
    }

    .heart {
      font-style: normal;
    }

    .ctl {
      display: none;
      min-height: 44px;
      padding: 0 20px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--paper);
      color: var(--ink);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(44, 33, 27, 0.1);
    }

    .stage.is-open .ctl {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* Mobile single-column & tabbed layout */
    @media (max-width: 720px) {
      html, body {
        overscroll-behavior-y: none;
      }

      :root {
        --w: min(92vw, 420px);
        --h: max(390px, min(calc(var(--vh) - 104px), calc(var(--w) * 1.48)));
        --fs: clamp(15px, calc(var(--w) * 0.043), 17.5px);
      }

      .stage {
        padding:
          max(12px, env(safe-area-inset-top))
          max(12px, env(safe-area-inset-right))
          max(14px, env(safe-area-inset-bottom))
          max(12px, env(safe-area-inset-left));
        gap: 12px;
      }

      .card.open {
        transform: none;
      }

      /* Hide 3D flipped cover on small screens so right page shows cleanly */
      .card.open .cover {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.35s ease;
      }

      .tabs {
        display: flex;
        position: sticky;
        top: 0;
        z-index: 5;
        background: var(--paper);
        padding-bottom: 6px;
        border-bottom: 1px solid rgba(207, 181, 150, 0.35);
      }

      .card[data-view="msg"] .mobile-message {
        display: block;
      }

      .card[data-view="msg"] .photos {
        display: none;
      }

      .card[data-view="photos"] .mobile-message {
        display: none;
      }

      .card[data-view="photos"] .photos {
        display: block;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .card, .cover, .msg p, .closing, .slide {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
<main class="stage" id="stage">
  <div class="card" id="card" data-view="msg">

    <!-- Inside right page -->
    <section class="face right" id="pageRight" aria-label="Photographs and closing message" inert>
      <div class="scroll"><div class="inner">
        <nav class="tabs" id="tabs" aria-label="Card pages">
          <button type="button" data-view="msg" aria-pressed="true">Message</button>
          <button type="button" data-view="photos" aria-pressed="false">Photos</button>
        </nav>
        <div class="mobile-message msg" id="msgMobile"></div>
        <section class="photos" id="photos" aria-label="Photographs">
          <h2 class="gallery-title" id="galleryTitle"></h2>
          <div class="slider" id="slider"></div>
          <p class="cap" id="cap"></p>
          <div class="slider-ctl" id="sliderCtl">
            <button type="button" id="prev" aria-label="Previous photo">‹</button>
            <div class="dots" id="dots"></div>
            <button type="button" id="next" aria-label="Next photo">›</button>
          </div>
        </section>
        <p class="closing" id="closing"></p>
      </div></div>
    </section>

    <!-- Cover: front = outside, back = inside left page -->
    <div class="cover" id="cover">
      <div class="face front" id="front" role="button" tabindex="0" aria-expanded="false" aria-label="Open your card">
        <div class="fine"></div>
        <h1>Happy Birthday,<span>Mumma <em class="heart">❤️</em></span></h1>
        <div class="rule"></div>
        <div class="hint">Open your card</div>
      </div>
      <section class="face back" id="pageLeft" aria-label="Birthday message" inert>
        <div class="scroll"><div class="inner msg" id="msgDesktop"></div></div>
      </section>
    </div>
  </div>
  <button class="ctl" id="toggle" type="button">Close card</button>
</main>

<script>
/* Dynamic viewport height helper for mobile browsers */
function syncVh() {
  const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  document.documentElement.style.setProperty('--vh', `${h}px`);
}
syncVh();
window.addEventListener('resize', syncVh, { passive: true });
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', syncVh, { passive: true });
}

/* GitHub repository image paths (keep in the same folder as this HTML file) */
const PHOTO_1 = "./IMG_2914.JPG";
const PHOTO_2 = "./FullSizeRender.jpg";

const CONFIG = {
  galleryTitle: "Favorite Moments",
  paragraphs: [
    "Happy Birthday, Mumma! Thank you for every quiet sacrifice, every warm meal, and every moment of strength you give our family.",
    "No matter how busy life gets or how much we grow, your care and patience are what keep us grounded.",
    "Wishing you a year filled with good health, peace, laughter, and all the happiness you so effortlessly bring to everyone around you."
  ],
  closing: "We love you endlessly, Mumma ❤️",
  photos: [
    { src: PHOTO_1, alt: "Mom and son smiling together indoors", caption: "Always by each other's side" },
    { src: PHOTO_2, alt: "Family sitting together at night with city lights in the background", caption: "Evening memories together" }
  ]
};

function withHeart(el, text) {
  el.textContent = '';
  const parts = text.split(/(❤️)/g);
  parts.forEach(part => {
    if (part === '❤️') {
      const span = document.createElement('span');
      span.className = 'heart';
      span.textContent = '❤️';
      el.appendChild(span);
    } else if (part) {
      el.appendChild(document.createTextNode(part));
    }
  });
}

function reveal(el, delayMs) {
  setTimeout(() => el.classList.add('revealed'), delayMs);
}

/* Populate message paragraphs for both desktop (left page) and mobile (tab) */
const msgDesktop = document.getElementById('msgDesktop');
const msgMobile = document.getElementById('msgMobile');

CONFIG.paragraphs.forEach((text, idx) => {
  const pDesk = document.createElement('p');
  withHeart(pDesk, text);
  reveal(pDesk, 250 + idx * 180);
  msgDesktop.appendChild(pDesk);

  const pMob = document.createElement('p');
  withHeart(pMob, text);
  reveal(pMob, 250 + idx * 180);
  msgMobile.appendChild(pMob);
});

/* Populate photo slider */
document.getElementById('galleryTitle').textContent = CONFIG.galleryTitle || '';
const slider = document.getElementById('slider');
const dotsWrap = document.getElementById('dots');
const cap = document.getElementById('cap');
const ctl = document.getElementById('sliderCtl');

const slides = CONFIG.photos.map((photo, i) => {
  const slide = document.createElement('div');
  slide.className = 'slide';

  const img = document.createElement('img');
  img.src = photo.src;
  img.alt = photo.alt || `Photo ${i + 1}`;
  img.loading = i === 0 ? 'eager' : 'lazy';
  slide.appendChild(img);
  slider.appendChild(slide);

  const dot = document.createElement('button');
  dot.type = 'button';
  dot.className = 'dot';
  dot.setAttribute('aria-label', `Show photo ${i + 1}`);
  dot.setAttribute('aria-selected', 'false');
  dot.addEventListener('click', () => show(i));
  dotsWrap.appendChild(dot);

  return { slide, dot };
});

let cur = 0;
function show(index) {
  if (!slides.length) return;
  cur = ((index % slides.length) + slides.length) % slides.length;
  slides.forEach((item, i) => {
    const active = i === cur;
    item.slide.classList.toggle('active', active);
    item.dot.setAttribute('aria-selected', String(active));
  });
  cap.textContent = CONFIG.photos[cur].caption || '';
}

document.getElementById('prev').addEventListener('click', () => show(cur - 1));
document.getElementById('next').addEventListener('click', () => show(cur + 1));
if (slides.length < 2) ctl.hidden = true;
show(0);

let x0 = null;
slider.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
slider.addEventListener('touchend', e => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0;
  x0 = null;
  if (Math.abs(dx) > 40) show(cur + (dx < 0 ? 1 : -1));
}, { passive: true });

const closing = document.getElementById('closing');
withHeart(closing, CONFIG.closing);
reveal(closing, 250 + CONFIG.paragraphs.length * 180);

/* Open / close */
const stage = document.getElementById('stage');
const card = document.getElementById('card');
const front = document.getElementById('front');
const toggle = document.getElementById('toggle');
const pages = [document.getElementById('pageLeft'), document.getElementById('pageRight')];
let resetTimer;

const tabBtns = [...document.querySelectorAll('#tabs button')];
function setView(v) {
  card.dataset.view = v;
  tabBtns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === v)));
  document.querySelector('#pageRight .scroll').scrollTop = 0;
}
tabBtns.forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));

function setOpen(open) {
  if (open) setView('msg');
  card.classList.toggle('open', open);
  stage.classList.toggle('is-open', open);
  front.setAttribute('aria-expanded', String(open));
  front.tabIndex = open ? -1 : 0;
  pages.forEach(p => { p.inert = !open; });
  clearTimeout(resetTimer);
  if (!open) {
    resetTimer = setTimeout(() => {
      document.querySelectorAll('.scroll').forEach(s => { s.scrollTop = 0; });
    }, 1300);
  }
}

front.addEventListener('click', () => { if (!card.classList.contains('open')) setOpen(true); });
front.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && !card.classList.contains('open')) {
    e.preventDefault();
    setOpen(true);
  }
});
toggle.addEventListener('click', () => { setOpen(false); front.focus({ preventScroll: true }); });
document.addEventListener('keydown', e => {
  if (!card.classList.contains('open')) return;
  if (e.key === 'Escape') setOpen(false);
  else if (e.key === 'ArrowRight') show(cur + 1);
  else if (e.key === 'ArrowLeft') show(cur - 1);
});
</script>
</body>
</html>
